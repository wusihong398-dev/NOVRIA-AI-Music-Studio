name: dongba_music
version: 0.1.0+1
description: 东巴音乐 Android/iOS 测试版
publish_to: 'none'
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/dongba_icon.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/dongba_icon.png
  min_sdk_android: 23
  remove_alpha_ios: true
