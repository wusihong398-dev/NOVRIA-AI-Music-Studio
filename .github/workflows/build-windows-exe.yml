name: Build Juweier Music Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "agent/juweier-v3.2.4" ]
    paths:
      - "app/**"
      - "assets/**"
      - "config/**"
      - "build_tools/**"
      - "installer/**"
      - "NOVRIA.spec"
      - "requirements.txt"
      - "requirements-build.txt"
      - "Check-GPU.bat"
      - "Install-AI-Engine.bat"
      - "Open-Model-Folder.bat"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build CPU-compatible EXE
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_tools\build_windows_exe.ps1

      - name: Verify v3.2.4 complete pipeline EXE
        shell: powershell
        run: |
          $root = "dist\Juweier-Music"
          $exe = "$root\Juweier-Music.exe"
          $worker = "$root\Juweier-Separation-Worker.exe"
          $ffmpeg = "$root\tools\ffmpeg\ffmpeg.exe"
          if (!(Test-Path $exe)) { throw "EXE not found: $exe" }
          if (!(Test-Path $worker)) { throw "Worker EXE not found: $worker" }
          if (!(Test-Path $ffmpeg)) { throw "Bundled FFmpeg not found: $ffmpeg" }

          # Keep verification ASCII-only so Windows PowerShell code pages cannot corrupt Chinese UI text.
          $launcher = Get-Content "app\launcher.py" -Raw -Encoding UTF8
          if ($launcher -notmatch 'VERSION\s*=\s*"3\.2\.3"') { throw "v3.2.4 launcher not found" }
          if (!(Select-String -Path "app\library_catalog.py" -Pattern "scan_catalog_roots" -Quiet)) { throw "Recursive multi-root library scan missing" }
          if (!(Select-String -Path "app\project_utils.py" -Pattern "electric_guitar.wav" -Quiet)) { throw "Electric-guitar second-stage split missing" }
          if (!(Select-String -Path "app\main.py" -Pattern "DesktopScoreCanvas" -Quiet)) { throw "Desktop staff/tab score canvas missing" }
          if ($launcher -notmatch 'def install_live_transpose_controls') { throw "Live transpose controls patch missing" }
          if ($launcher -notmatch 'def _recommended_capo') { throw "Capo sync patch missing" }
          if ($launcher -notmatch 'change\(-1\)') { throw "Transpose-down action missing" }
          if ($launcher -notmatch 'change\(1\)') { throw "Transpose-up action missing" }
          if (!(Select-String -Path "NOVRIA.spec" -Pattern "Juweier-Separation-Worker" -Quiet)) { throw "Isolated worker is not configured in PyInstaller" }
          python -m unittest discover -s tests -v

          & $ffmpeg -version | Select-Object -First 1
          Get-Item $exe,$worker,$ffmpeg | Format-Table Name,Length,FullName

      - name: Package Windows build
        shell: powershell
        run: |
          Compress-Archive -Path "dist\Juweier-Music\*" -DestinationPath "Juweier_Music_v3.2.4_Windows_x64.zip" -Force

      - name: Build Windows installer
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "installer\NOVRIA.iss"
          if (!(Test-Path "release\Juweier_Music_v3.2.4_Setup_x64.exe")) { throw "Installer was not created" }

      - name: Upload v3.2.4 Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.2.4-Windows-x64
          path: |
            Juweier_Music_v3.2.4_Windows_x64.zip
            release/Juweier_Music_v3.2.4_Setup_x64.exe
          if-no-files-found: error
          retention-days: 30
