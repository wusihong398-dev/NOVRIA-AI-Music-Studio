name: Build NOVRIA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "mobile/**"
      - ".github/workflows/build-mobile.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build CUDA EXE
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_tools\build_windows_exe.ps1

      - name: Verify v2.1.6 Live Transpose EXE
        shell: powershell
        run: |
          $root = "dist\NOVRIA-AI-Music-Studio"
          $exe = "$root\NOVRIA-AI-Music-Studio.exe"
          $worker = "$root\NOVRIA-Separation-Worker.exe"
          $ffmpeg = "$root\tools\ffmpeg\ffmpeg.exe"
          if (!(Test-Path $exe)) { throw "EXE not found: $exe" }
          if (!(Test-Path $worker)) { throw "Worker EXE not found: $worker" }
          if (!(Test-Path $ffmpeg)) { throw "Bundled FFmpeg not found: $ffmpeg" }
          if (!(Select-String -Path "app\launcher.py" -Pattern 'VERSION = "2.1.6"' -Quiet)) { throw "v2.1.6 launcher not found" }
          if (!(Select-String -Path "app\launcher.py" -Pattern '▲ 升半音' -Quiet)) { throw "Live transpose up button missing" }
          if (!(Select-String -Path "app\launcher.py" -Pattern '▼ 降半音' -Quiet)) { throw "Live transpose down button missing" }
          if (!(Select-String -Path "app\launcher.py" -Pattern 'recommended_capo' -Quiet)) { throw "Capo sync patch missing" }
          if (!(Select-String -Path "NOVRIA.spec" -Pattern "NOVRIA-Separation-Worker" -Quiet)) { throw "Isolated worker is not configured in PyInstaller" }
          & $ffmpeg -version | Select-Object -First 1
          Get-Item $exe,$worker,$ffmpeg | Format-Table Name,Length,FullName

      - name: Package Windows build
        shell: powershell
        run: |
          Compress-Archive -Path "dist\NOVRIA-AI-Music-Studio\*" -DestinationPath "Dongba_Music_v2.1.6_Live_Transpose_Windows_x64.zip" -Force

      - name: Upload v2.1.6 Live Transpose artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dongba-Music-v2.1.6-Live-Transpose-Windows-x64
          path: Dongba_Music_v2.1.6_Live_Transpose_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
