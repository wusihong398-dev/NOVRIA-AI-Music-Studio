name: Build NOVRIA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Build EXE
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_tools\build_windows_exe.ps1
      - name: Verify v2.1.2 Import Fix EXE
        shell: powershell
        run: |
          $root = "dist\NOVRIA-AI-Music-Studio"
          $exe = "$root\NOVRIA-AI-Music-Studio.exe"
          $ffmpeg = "$root\tools\ffmpeg\ffmpeg.exe"
          if (!(Test-Path $exe)) { throw "EXE not found: $exe" }
          if (!(Test-Path $ffmpeg)) { throw "Bundled FFmpeg not found: $ffmpeg" }
          if (!(Select-String -Path "app\launcher.py" -Pattern 'VERSION = "2.1.2"' -Quiet)) { throw "v2.1.2 launcher not found" }
          if (!(Select-String -Path "NOVRIA.spec" -Pattern "app/launcher.py" -Quiet)) { throw "PyInstaller is not using launcher.py" }
          & $ffmpeg -version | Select-Object -First 1
          Get-Item $exe,$ffmpeg | Format-Table Name,Length,FullName
      - name: Package Windows build
        shell: powershell
        run: |
          Compress-Archive -Path "dist\NOVRIA-AI-Music-Studio\*" -DestinationPath "NOVRIA_AI_Music_Studio_v2.1.2_Import_Fix_Windows_x64.zip" -Force
      - name: Upload v2.1.2 Import Fix artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVRIA-AI-Music-Studio-v2.1.2-Import-Fix-Windows-x64
          path: NOVRIA_AI_Music_Studio_v2.1.2_Import_Fix_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
