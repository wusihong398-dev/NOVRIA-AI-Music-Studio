name: Build Juweier Music iOS TestFlight Package
run-name: Juweier Music v3.5.0 iOS TestFlight · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.5.0"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-ios-testflight-package.yml"

permissions:
  contents: read

# release trigger: v3.5.0 TestFlight project

jobs:
  ios-project:
    name: iOS Xcode project for TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS Flutter project
        shell: bash
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=android,ios mobile_ios
          rm -rf mobile_ios/lib
          cp -r mobile/lib mobile_ios/lib
          cp mobile/pubspec.yaml mobile_ios/pubspec.yaml
          cp -r mobile/assets mobile_ios/assets
          cd mobile_ios
          flutter pub get
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;', project.read_text())
          project.write_text(text)
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 需要连接橘味儿音乐成品服务器" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Add TestFlight upload instructions
        shell: bash
        run: |
          cat > mobile_ios/README_TESTFLIGHT_MAC.md <<'EOF'
          # 橘味儿音乐 iOS TestFlight 上传说明

          这是未签名的 v3.5.0 Flutter/Xcode 工程。请在 Mac 上执行：

          ```bash
          cd mobile_ios
          flutter pub get
          cd ios
          pod install
          open Runner.xcworkspace
          ```

          在 Xcode 的 Signing & Capabilities 中选择 Apple Developer 团队，
          Bundle Identifier 使用 `com.db0888.juweierMusic`，然后执行
          Product → Archive → Distribute App → App Store Connect。
          EOF
      - name: Upload TestFlight Xcode project without nested archive
        uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.5.0-iOS-TestFlight-Xcode-Project
          path: mobile_ios
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
