name: Build Dongba Music iOS TestFlight Package

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-ios-testflight-package.yml"

permissions:
  contents: read

jobs:
  ios-project:
    name: iOS Xcode project for TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS Flutter project
        shell: bash
        run: |
          flutter create --org com.db0888 --project-name dongba_music --platforms=ios mobile_ios
          rm -rf mobile_ios/lib
          cp -r mobile/lib mobile_ios/lib
          cp mobile/pubspec.yaml mobile_ios/pubspec.yaml
          mkdir -p mobile_ios/assets
          python3 - <<'PY'
          import struct,zlib
          w=h=256
          raw=bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx=x-128; dy=y-128; r=(dx*dx+dy*dy)**0.5
                  c=(215,166,58) if r<100 else (7,16,29)
                  raw.extend(c)
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          open('mobile_ios/assets/dongba_icon.png','wb').write(png)
          PY
          cd mobile_ios
          flutter pub get
          dart run flutter_launcher_icons
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 东巴音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 东巴音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppleMusicUsageDescription string 需要选择音乐文件进行AI分轨和演出谱面生成" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 后续用于录音和演唱分析" ios/Runner/Info.plist || true
          flutter build ios --release --no-codesign
      - name: Add TestFlight upload instructions
        shell: bash
        run: |
          cat > mobile_ios/README_TESTFLIGHT_MAC.md <<'EOF'
          # 东巴音乐 iOS TestFlight 上传说明

          这个包是未签名 iOS Flutter/Xcode 工程。请在你的 Mac 上完成签名、归档并上传 TestFlight。

          ## 1. 解压并安装依赖
          ```bash
          cd mobile_ios
          flutter pub get
          cd ios
          pod install
          open Runner.xcworkspace
          ```

          ## 2. Xcode 设置
          - 选择 Runner 项目
          - Signing & Capabilities
          - 勾选 Automatically manage signing
          - Team 选择你的 Apple Developer 团队
          - Bundle Identifier 建议改为：`com.db0888.dongbaMusic`
          - Version 当前来自 pubspec：0.1.2
          - Build：3，可按需要递增

          ## 3. 归档上传
          - 顶部设备选择：Any iOS Device 或 Generic iOS Device
          - 菜单 Product → Archive
          - Archive 完成后点 Distribute App
          - 选择 App Store Connect
          - 上传完成后到 App Store Connect → TestFlight 等待处理
          EOF
      - name: Package iOS Xcode project
        shell: bash
        run: |
          zip -qry Dongba-Music-iOS-TestFlight-Xcode-Project.zip mobile_ios
      - name: Upload iOS TestFlight project package
        uses: actions/upload-artifact@v4
        with:
          name: Dongba-Music-iOS-TestFlight-Xcode-Project
          path: Dongba-Music-iOS-TestFlight-Xcode-Project.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
