name: Build Juweier Music iOS TestFlight Package

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.2.2"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-ios-testflight-package.yml"

permissions:
  contents: read

jobs:
  ios-project:
    name: iOS Xcode project for TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create iOS Flutter project
        shell: bash
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=android,ios mobile_ios
          rm -rf mobile_ios/lib
          cp -r mobile/lib mobile_ios/lib
          cp mobile/pubspec.yaml mobile_ios/pubspec.yaml
          cp -r mobile/assets mobile_ios/assets
          cd mobile_ios
          flutter pub get
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;', project.read_text())
          project.write_text(text)
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppleMusicUsageDescription string 需要选择音乐文件进行AI分轨和演出谱面生成" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 后续用于录音和演唱分析" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 需要连接局域网内的橘味儿音乐AI服务器" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
          flutter analyze lib --no-fatal-infos
      - name: Add TestFlight upload instructions
        shell: bash
        run: |
          cat > mobile_ios/README_TESTFLIGHT_MAC.md <<'EOF'
          # 橘味儿音乐 iOS TestFlight 上传说明

          这个包是未签名 iOS Flutter/Xcode 工程。请在你的 Mac 上完成签名、归档并上传 TestFlight。

          ## 1. 解压并安装依赖
          ```bash
          cd mobile_ios
          flutter pub get
          cd ios
          pod install
          open Runner.xcworkspace
          ```

          ## 2. Xcode 设置
          - 选择 Runner 项目
          - Signing & Capabilities
          - 勾选 Automatically manage signing
          - Team 选择你的 Apple Developer 团队
          - Bundle Identifier：`com.db0888.juweierMusic`
          - Version 当前来自 pubspec：3.2.2
          - Build：310，可按需要递增

          ## 3. 归档上传
          - 顶部设备选择：Any iOS Device 或 Generic iOS Device
          - 菜单 Product → Archive
          - Archive 完成后点 Distribute App
          - 选择 App Store Connect
          - 上传完成后到 App Store Connect → TestFlight 等待处理
          EOF
      - name: Package iOS Xcode project
        shell: bash
        run: |
          zip -qry Juweier-Music-v3.2.2-iOS-TestFlight-Xcode-Project.zip mobile_ios
      - name: Upload iOS TestFlight project package
        uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.2.2-iOS-TestFlight-Xcode-Project
          path: Juweier-Music-v3.2.2-iOS-TestFlight-Xcode-Project.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
