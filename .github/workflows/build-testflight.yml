name: Build Juweier Music TestFlight
run-name: TestFlight · ${{ inputs.source_ref }} · build ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch/tag to build
        required: true
        default: agent/juweier-v3.5.10
        type: string
      upload_to_testflight:
        description: Upload IPA to TestFlight after build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate signing secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID IOS_BUNDLE_ID IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Patch source
        shell: bash
        run: |
          for patch in \
            mobile/patch_playback_v353.py \
            mobile/patch_playback_v354.py \
            mobile/patch_playback_v355.py \
            mobile/patch_lyrics_v355.py \
            mobile/patch_playback_v356.py \
            mobile/patch_playback_v357.py \
            mobile/patch_playback_v358.py \
            mobile/patch_offline_v359.py \
            mobile/patch_offline_v3510.py; do
            [ -f "$patch" ] && python3 "$patch"
          done

      - name: Prepare iOS project and icon
        shell: bash
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=ios mobile_build
          rm -rf mobile_build/lib && cp -r mobile/lib mobile_build/lib
          cp mobile/pubspec.yaml mobile_build/pubspec.yaml
          cp -r mobile/assets mobile_build/assets
          cd mobile_build
          flutter pub get
          python3 -m venv .iconvenv
          .iconvenv/bin/python -m pip install --quiet --upgrade pip pillow
          .iconvenv/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/juweier_icon.png')
          im=Image.open(p).convert('RGBA')
          bg=Image.new('RGBA',(1024,1024),(255,255,255,255))
          im.thumbnail((960,960), Image.Resampling.LANCZOS)
          bg.alpha_composite(im, ((1024-im.width)//2,(1024-im.height)//2))
          bg.convert('RGB').save(p)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text(encoding='utf-8').replace('  android: true','  android: false',1)
          p.write_text(s, encoding='utf-8')
          PY
          dart run flutter_launcher_icons
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 橘味儿音乐" ios/Runner/Info.plist || true

      - name: Install signing certificate and provisioning profile
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          cd mobile_build
          KEYCHAIN="$RUNNER_TEMP/juweier-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          export PROFILE_NAME
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('ios/Runner.xcodeproj/project.pbxproj')
          s=p.read_text(encoding='utf-8')
          bundle=os.environ['IOS_BUNDLE_ID']
          team=os.environ['APPLE_TEAM_ID']
          profile=os.environ['PROFILE_NAME']
          s=re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};', s)
          s=re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', s)
          if 'DEVELOPMENT_TEAM =' in s:
              s=re.sub(r'DEVELOPMENT_TEAM = [^;]+;', f'DEVELOPMENT_TEAM = {team};', s)
          else:
              s=s.replace('CODE_SIGN_STYLE = Manual;', f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = {team};')
          if 'PROVISIONING_PROFILE_SPECIFIER =' in s:
              s=re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]+;', f'PROVISIONING_PROFILE_SPECIFIER = "{profile}";', s)
          else:
              s=s.replace(f'DEVELOPMENT_TEAM = {team};', f'DEVELOPMENT_TEAM = {team};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";')
          p.write_text(s, encoding='utf-8')
          PY
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$IOS_BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        shell: bash
        run: |
          cd mobile_build
          flutter build ipa --release --build-name=3.5.10 --build-number=${{ github.run_number }} --export-options-plist=ios/ExportOptions.plist
          test -n "$(find build/ios/ipa -name '*.ipa' -size +1M -print -quit)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.5.10-TestFlight-IPA
          path: mobile_build/build/ios/ipa/*.ipa
          retention-days: 30
          compression-level: 0

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight == true }}
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          IPA=$(find mobile_build/build/ios/ipa -name '*.ipa' | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
