name: Package Juweier Music Windows Server Upgrade
run-name: Juweier Music v3.4.0 Server Upgrade · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.4.0"]
    paths:
      - "server/**"
      - "app/**"
      - "tools/**"
      - "requirements-server.txt"
      - "Start-Juweier-Server-v340*"
      - "RELEASE_NOTES_v3.4.0.md"
      - ".github/workflows/package-server-upgrade.yml"

permissions:
  contents: read

jobs:
  server-upgrade:
    name: Windows server overlay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify server source
        run: |
          python -m compileall -q app server tools
          grep -q 'VERSION = "3.4.0"' server/mobile_api.py
          grep -q "H:\\juweier-music" Start-Juweier-Server-v340-Products.ps1
          grep -q "G:\\JuweierMusicProcessed" Start-Juweier-Server-v340-Products.ps1
      - name: Stage single-layer upgrade
        shell: bash
        run: |
          mkdir -p server-upgrade
          cp -R app server tools server-upgrade/
          cp requirements-server.txt requirements-lyrics-server.txt server-upgrade/
          cp Start-Juweier-Server-v340.cmd Start-Juweier-Server-v340-Products.ps1 server-upgrade/
          cp RELEASE_NOTES_v3.4.0.md server-upgrade/
      - name: Upload server upgrade without nested archive
        uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.4.0-Windows-Server-Upgrade
          path: server-upgrade
          if-no-files-found: error
          retention-days: 30
