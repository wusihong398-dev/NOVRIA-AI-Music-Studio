name: Build Juweier Music v3.5.10 TestFlight
run-name: Juweier Music v3.5.10 TestFlight · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Build IPA and upload to TestFlight'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo 'Missing APPLE_TEAM_ID'; exit 1; }
          test -n "$IOS_BUNDLE_ID" || { echo 'Missing IOS_BUNDLE_ID'; exit 1; }
          test -n "$IOS_P12_BASE64" || { echo 'Missing IOS_P12_BASE64'; exit 1; }
          test -n "$IOS_P12_PASSWORD" || { echo 'Missing IOS_P12_PASSWORD'; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo 'Missing IOS_PROVISIONING_PROFILE_BASE64'; exit 1; }
          if [ "${{ inputs.upload_to_testflight }}" = "true" ]; then
            test -n "$APP_STORE_CONNECT_API_KEY_ID" || { echo 'Missing APP_STORE_CONNECT_API_KEY_ID'; exit 1; }
            test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo 'Missing APP_STORE_CONNECT_ISSUER_ID'; exit 1; }
            test -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64" || { echo 'Missing APP_STORE_CONNECT_API_KEY_P8_BASE64'; exit 1; }
          fi

      - name: Apply v3.5.10 mobile patches
        run: |
          python3 mobile/patch_playback_v353.py
          python3 mobile/patch_playback_v354.py
          python3 mobile/patch_playback_v355.py
          python3 mobile/patch_lyrics_v355.py
          python3 mobile/patch_playback_v356.py
          python3 mobile/patch_playback_v357.py
          python3 mobile/patch_playback_v358.py
          python3 mobile/patch_offline_v359.py
          python3 mobile/patch_offline_v3510.py

      - name: Create iOS device project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=ios mobile_device
          rm -rf mobile_device/lib && cp -r mobile/lib mobile_device/lib
          cp mobile/pubspec.yaml mobile_device/pubspec.yaml
          cp -r mobile/assets mobile_device/assets
          cd mobile_device
          flutter pub get
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('ios/Runner.xcodeproj/project.pbxproj')
          s = p.read_text(encoding='utf-8')
          bundle = os.environ['IOS_BUNDLE_ID']
          team = os.environ['APPLE_TEAM_ID']
          s = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', f'PRODUCT_BUNDLE_IDENTIFIER = {bundle};', s)
          s = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = {team};', s)
          if 'DEVELOPMENT_TEAM =' not in s:
              s = s.replace('CODE_SIGN_STYLE = Automatic;', f'CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = {team};')
          p.write_text(s, encoding='utf-8')
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 橘味儿音乐" ios/Runner/Info.plist || true

      - name: Rebuild iOS launcher icon
        run: |
          cd mobile_device
          python3 -m venv .iconvenv
          .iconvenv/bin/python -m pip install --quiet --upgrade pip pillow
          .iconvenv/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/juweier_icon.png')
          im=Image.open(p).convert('RGBA')
          canvas=Image.new('RGBA',(1024,1024),(0,0,0,0))
          im.thumbnail((960,960), Image.Resampling.LANCZOS)
          canvas.alpha_composite(im, ((1024-im.width)//2,(1024-im.height)//2))
          canvas.save(p)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text(encoding='utf-8').replace('  android: true','  android: false',1)
          p.write_text(s, encoding='utf-8')
          PY
          dart run flutter_launcher_icons
          test "$(find ios/Runner/Assets.xcassets/AppIcon.appiconset -type f -name '*.png' -size +1k | wc -l)" -ge 10

      - name: Install distribution certificate and provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/juweier-signing.keychain-db"
          KEYCHAIN_PASSWORD="juweier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/bin/security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          PROFILE_NAME=$(/usr/bin/security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Create App Store export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cat > mobile_device/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build signed TestFlight IPA
        run: |
          cd mobile_device
          grep -q "appVersion = '3.5.10'" lib/main.dart
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          IPA=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | head -1)
          test -n "$IPA" && test -s "$IPA"
          mkdir -p ../testflight-output
          cp "$IPA" ../testflight-output/Juweier-Music-v3.5.10-TestFlight.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.5.10-TestFlight-IPA
          path: testflight-output/Juweier-Music-v3.5.10-TestFlight.ipa
          retention-days: 30
          compression-level: 0

      - name: Upload IPA to TestFlight
        if: ${{ inputs.upload_to_testflight == true }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file testflight-output/Juweier-Music-v3.5.10-TestFlight.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
