name: Build Juweier Music v3.5.7 Android and iOS
on:
  workflow_dispatch:
  push:
    branches: [agent/juweier-v3.5.7]
    paths: [mobile/**, .github/workflows/build-mobile-v357.yml]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Patch source
        run: |
          python3 mobile/patch_playback_v353.py
          python3 mobile/patch_playback_v354.py
          python3 mobile/patch_playback_v355.py
          python3 mobile/patch_lyrics_v355.py
          python3 mobile/patch_playback_v356.py
          python3 mobile/patch_playback_v357.py
      - name: Prepare Android
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=android mobile_build
          rm -rf mobile_build/lib && cp -r mobile/lib mobile_build/lib
          cp mobile/pubspec.yaml mobile_build/pubspec.yaml
          cp -r mobile/assets mobile_build/assets
          cd mobile_build && flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text()
          if 'android.permission.INTERNET' not in s: s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n<uses-permission android:name="android.permission.INTERNET" />')
          p.write_text(s)
          PY
      - name: Verify and build Android
        run: |
          grep -q "appVersion = '3.5.7'" mobile_build/lib/main.dart
          grep -q "if (loadingJobId.isNotEmpty) return" mobile_build/lib/main.dart
          grep -q "loadGeneration" mobile_build/lib/main.dart
          cd mobile_build
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with: {name: Juweier-Music-v3.5.7-Android-APK, path: mobile_build/build/app/outputs/flutter-apk/app-release.apk, retention-days: 30, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: Juweier-Music-v3.5.7-Android-AAB, path: mobile_build/build/app/outputs/bundle/release/app-release.aab, retention-days: 30, compression-level: 0}
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Patch source
        run: |
          python3 mobile/patch_playback_v353.py
          python3 mobile/patch_playback_v354.py
          python3 mobile/patch_playback_v355.py
          python3 mobile/patch_lyrics_v355.py
          python3 mobile/patch_playback_v356.py
          python3 mobile/patch_playback_v357.py
      - name: Prepare iOS
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=ios mobile_build
          rm -rf mobile_build/lib && cp -r mobile/lib mobile_build/lib
          cp mobile/pubspec.yaml mobile_build/pubspec.yaml
          cp -r mobile/assets mobile_build/assets
          cd mobile_build && flutter pub get
      - name: Verify and build iOS
        run: |
          grep -q "appVersion = '3.5.7'" mobile_build/lib/main.dart
          grep -q "if (loadingJobId.isNotEmpty) return" mobile_build/lib/main.dart
          grep -q "loadGeneration" mobile_build/lib/main.dart
          cd mobile_build
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
          flutter build ios --simulator --debug
      - name: Stage app
        run: mkdir -p ios-simulator && cp -R mobile_build/build/ios/iphonesimulator/Runner.app ios-simulator/Runner.app
      - uses: actions/upload-artifact@v4
        with: {name: Juweier-Music-v3.5.7-iOS-Simulator, path: ios-simulator, retention-days: 30, compression-level: 0}
