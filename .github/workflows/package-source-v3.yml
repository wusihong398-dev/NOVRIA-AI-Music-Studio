name: Package Juweier Music v3 Source
run-name: Juweier Music v3.4.0 Source · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.4.0"]

permissions:
  contents: read

jobs:
  source:
    name: Complete source archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify v3.4.0 source
        run: |
          python -m compileall -q app server tests tools
          python -m unittest discover -s tests -v
          grep -q 'VERSION = "3.4.0"' app/main.py
          grep -q 'VERSION = "3.4.0"' server/mobile_api.py
          grep -q 'version: 3.4.0+340' mobile/pubspec.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.4.0-Complete-Source
          path: |
            .
            !.git/**
            !**/__pycache__/**
            !**/*.pyc
            !mobile_server_data/**
          if-no-files-found: error
          retention-days: 30
