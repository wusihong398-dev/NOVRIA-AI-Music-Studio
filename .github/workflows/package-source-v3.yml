name: Package Juweier Music v3 Source

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.0.0"]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  source:
    name: Complete source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify v3 source
        run: |
          python -m compileall -q app server tests
          python -m unittest discover -s tests -v
          grep -q 'VERSION = "3.0.0"' app/main.py
          grep -q 'VERSION = "3.0.0"' server/mobile_api.py
      - name: Package complete source first
        run: |
          zip -qry "$RUNNER_TEMP/Juweier-Music-v3.0.0-Complete-Source.zip" . \
            -x '.git/*' '__pycache__/*' '*.pyc' 'mobile_server_data/*'
          cp "$RUNNER_TEMP/Juweier-Music-v3.0.0-Complete-Source.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.0.0-Complete-Source
          path: Juweier-Music-v3.0.0-Complete-Source.zip
          if-no-files-found: error
          retention-days: 30
