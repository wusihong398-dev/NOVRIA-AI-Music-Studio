name: Package Juweier Music v3 Source
run-name: Juweier Music v3.5.0 Source · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.5.0"]
    paths-ignore:
      - ".github/workflows/build-mobile.yml"
      - ".github/workflows/build-ios-testflight-package.yml"
      - ".github/workflows/build-windows-exe.yml"
      - ".github/workflows/package-server-upgrade.yml"

permissions:
  contents: read

# release trigger: v3.5.0 complete source (contents dispatch)

jobs:
  source:
    name: Complete source archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented pypinyin numpy
      - name: Verify v3.5.0 source
        run: |
          python -m compileall -q app server tests tools
          python -m unittest discover -s tests -v
          grep -q 'VERSION = "3.5.0"' app/main.py
          grep -q 'VERSION = "3.5.0"' server/mobile_api.py
          grep -q 'version: 3.5.0+350' mobile/pubspec.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.5.0-Complete-Source
          path: |
            .
            !.git/**
            !**/__pycache__/**
            !**/*.pyc
            !mobile_server_data/**
          if-no-files-found: error
          retention-days: 30
