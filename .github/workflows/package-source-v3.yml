name: Package Juweier Music v3 Source
run-name: Juweier Music v3.2.7 Source · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.2.7"]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/build-mobile.yml"
      - ".github/workflows/build-ios-testflight-package.yml"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  source:
    name: Complete source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify v3 source
        run: |
          python -m compileall -q app server tests
          python -m unittest discover -s tests -v
          grep -q 'VERSION = "3.2.7"' app/main.py
          grep -q 'VERSION = "3.2.7"' server/mobile_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.2.7-Complete-Source
          path: |
            .
            !.git/**
            !**/__pycache__/**
            !**/*.pyc
            !mobile_server_data/**
          if-no-files-found: error
          retention-days: 30
