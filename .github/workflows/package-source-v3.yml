name: Package Juweier Music v3.5.7 Source
run-name: Juweier Music v3.5.7 Complete Source · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["agent/juweier-v3.5.7"]
    paths:
      - "app/**"
      - "server/**"
      - "mobile/**"
      - "tools/**"
      - "tests/**"
      - "config/**"
      - "build_tools/**"
      - "installer/**"
      - "*.py"
      - "*.spec"
      - "requirements*.txt"
      - ".github/workflows/package-source-v3.yml"

permissions:
  contents: read

jobs:
  source:
    name: Complete v3.5.7 source archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify v3.5.7 source tree
        shell: bash
        run: |
          test -f mobile/lib/main.dart
          test -f server/mobile_api.py
          test -f app/main.py
          test -f app/launcher.py
          test -f NOVRIA.spec
          grep -q 'version: 3.5.7+357' mobile/pubspec.yaml
          test -f mobile/patch_playback_v357.py
      - name: Write source manifest
        shell: bash
        run: |
          printf '%s\n' \
            '橘味儿音乐 Juweier Music v3.5.7 完整源码' \
            'Branch: agent/juweier-v3.5.7' \
            "Commit: $GITHUB_SHA" \
            '包含：Windows 客户端、Android/iOS Flutter 客户端、GPU/AI 服务器、批处理工具、安装与 GitHub Actions 构建脚本。' \
            > SOURCE_VERSION_v3.5.7.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.5.7-Complete-Source
          path: |
            .
            !.git/**
            !**/__pycache__/**
            !**/*.pyc
            !mobile_server_data/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
