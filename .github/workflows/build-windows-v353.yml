name: Build Juweier Music v3.5.3 Windows
run-name: Juweier Music v3.5.3 Windows · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ["agent/juweier-v3.5.3"]
    paths:
      - "app/**"
      - "tools/patch_windows_cache_v353.py"
      - "assets/**"
      - "config/**"
      - "build_tools/**"
      - "installer/**"
      - "NOVRIA.spec"
      - "requirements*.txt"
      - ".github/workflows/build-windows-v353.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply v3.5.3 Windows cache fix
        shell: powershell
        run: |
          python tools\patch_windows_cache_v353.py
          $p='app\launcher.py'
          $s=Get-Content $p -Raw -Encoding UTF8
          $s=$s -replace 'VERSION = "3\.5\.[0-9]+"','VERSION = "3.5.3"'
          Set-Content $p $s -Encoding UTF8
          $p='installer\NOVRIA.iss'
          $s=Get-Content $p -Raw -Encoding UTF8
          $s=$s -replace '#define MyAppVersion "3\.5\.[0-9]+"','#define MyAppVersion "3.5.3"'
          $s=$s -replace 'Juweier_Music_v3\.5\.[0-9]+_Setup_x64','Juweier_Music_v3.5.3_Setup_x64'
          $s=$s -replace 'VersionInfoVersion=3\.5\.[0-9]+\.0','VersionInfoVersion=3.5.3.0'
          $s=$s -replace 'VersionInfoProductVersion=3\.5\.[0-9]+','VersionInfoProductVersion=3.5.3'
          Set-Content $p $s -Encoding UTF8
      - name: Build Windows EXE
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_tools\build_windows_exe.ps1
      - name: Verify v3.5.3 Windows fixes
        shell: powershell
        run: |
          $root='dist\Juweier-Music'
          if (!(Test-Path "$root\Juweier-Music.exe")) { throw 'EXE missing' }
          if (!(Test-Path "$root\Juweier-Separation-Worker.exe")) { throw 'Worker missing' }
          if (!(Test-Path "$root\tools\ffmpeg\ffmpeg.exe")) { throw 'FFmpeg missing' }
          if (!(Select-String -Path 'app\main.py' -Pattern '_SERVER_ARTIFACT_CACHE_LOCKS' -Quiet)) { throw 'Cache lock fix missing' }
          if (!(Select-String -Path 'app\main.py' -Pattern 'winerror' -Quiet)) { throw 'WinError 32 retry missing' }
          if (!(Select-String -Path 'app\main.py' -Pattern 'VERSION = "3.5.3"' -Quiet)) { throw 'v3.5.3 main version missing' }
          python -m unittest discover -s tests -v
          $env:PATH="$root\tools\ffmpeg;$env:PATH"
          & "$root\Juweier-Separation-Worker.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Worker self-test failed' }
      - name: Build installer
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'installer\NOVRIA.iss'
          if (!(Test-Path 'release\Juweier_Music_v3.5.3_Setup_x64.exe')) { throw 'Installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.5.3-Windows-x64-Portable
          path: dist/Juweier-Music
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.5.3-Windows-Setup
          path: release/Juweier_Music_v3.5.3_Setup_x64.exe
          retention-days: 30
          compression-level: 0
