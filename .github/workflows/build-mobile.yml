name: Build Juweier Music Android and iOS

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/juweier-v3.0.0"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter platform project
        shell: bash
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=android,ios mobile_build
          rm -rf mobile_build/lib
          cp -r mobile/lib mobile_build/lib
          cp mobile/pubspec.yaml mobile_build/pubspec.yaml
          cp -r mobile/assets mobile_build/assets
          cd mobile_build
          flutter pub get
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          if '<uses-permission android:name="android.permission.INTERNET" />' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          s=s.replace('android:label="juweier_music"','android:label="橘味儿音乐"')
          s=s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(s)
          PY
      - name: Build release APK
        working-directory: mobile_build
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.0.0-Android-APK
          path: mobile_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  ios:
    name: iOS unsigned app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter platform project
        shell: bash
        run: |
          flutter create --org com.db0888 --project-name juweier_music --platforms=android,ios mobile_build
          rm -rf mobile_build/lib
          cp -r mobile/lib mobile_build/lib
          cp mobile/pubspec.yaml mobile_build/pubspec.yaml
          cp -r mobile/assets mobile_build/assets
          cd mobile_build
          flutter pub get
          dart run flutter_launcher_icons
          python3 - <<'PY'
          from pathlib import Path
          import re
          podfile = Path('ios/Podfile')
          text = podfile.read_text()
          text = re.sub(r"#?\s*platform :ios, '[^']+'", "platform :ios, '14.0'", text, count=1)
          podfile.write_text(text)
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;', project.read_text())
          project.write_text(text)
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 橘味儿音乐" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 需要连接局域网内的橘味儿音乐AI服务器" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
      - name: Build iOS simulator app without signing
        working-directory: mobile_build
        run: flutter build ios --simulator --release
      - name: Package iOS simulator app
        shell: bash
        run: |
          cd mobile_build/build/ios/iphonesimulator
          zip -0qry ../../../../Juweier-Music-v3.0.0-iOS-Simulator.zip Runner.app
      - name: Upload iOS simulator package
        uses: actions/upload-artifact@v4
        with:
          name: Juweier-Music-v3.0.0-iOS-Simulator
          path: Juweier-Music-v3.0.0-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
